<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Skin Grabber</title>
<style>
  :root { --bg:#1e2a1e; --card:#2b3b2b; --text:#f2f5ee; --accent:#5fbf4a; --muted:#a9b8a3; }
  @media (prefers-color-scheme: light) { :root { --bg:#e8efe2; --card:#fff; --text:#1d2a1d; --muted:#5b6b57; } }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
         background:var(--bg); color:var(--text); font-family:system-ui,sans-serif; padding:16px; }
  main { background:var(--card); border-radius:14px; padding:24px; width:100%; max-width:420px; text-align:center; }
  h1 { margin:0 0 16px; font-size:1.5rem; }
  form { display:flex; gap:8px; }
  input { flex:1; padding:10px 12px; font-size:1rem; border-radius:8px; border:2px solid var(--muted);
          background:transparent; color:var(--text); min-width:0; }
  button, a.dl { padding:10px 16px; font-size:1rem; border:0; border-radius:8px; background:var(--accent);
          color:#0f1d0f; font-weight:600; cursor:pointer; text-decoration:none; display:inline-block; }
  #out { margin-top:20px; display:none; }
  #body3d { width:240px; max-width:100%; height:auto; aspect-ratio:240/340; cursor:grab; touch-action:none; background:#0002; border-radius:10px; }
  #sheet { image-rendering:pixelated; width:256px; height:256px; background:#0003; margin:8px 0 16px; }
  #msg { margin-top:14px; color:var(--muted); min-height:1.2em; }
  hr { border:0; border-top:1px solid var(--muted); opacity:.4; margin:22px 0 16px; }
  h2 { margin:0 0 8px; font-size:1.15rem; }
  #head3d { width:100%; max-width:280px; aspect-ratio:1; cursor:grab; touch-action:none; background:#0002; border-radius:10px; }
  .hint { color:var(--muted); font-size:.85rem; margin:6px 0 12px; }
  #mm, .k { flex:none; width:90px; margin:0 8px; padding:8px; }
  .row { display:flex; gap:20px; justify-content:center; flex-wrap:wrap; align-items:center; }
</style>
</head>
<body>
<main>
  <h1>Minecraft Skin Grabber</h1>
  <form id="f">
    <input id="name" placeholder="Username" maxlength="16" autocomplete="off" required>
    <button>Go</button>
  </form>
  <div id="msg"></div>
  <div id="out">
    <div class="row">
      <canvas id="body3d" width="240" height="340"></canvas>
      <canvas id="sheet" width="64" height="64"></canvas>
    </div>
    <p class="hint">Drag to spin. Shown with the 3D skin layers mod on.</p>
    <p class="hint">Layer size: head <input id="kh" class="k" type="number" value="1.18" min="1" max="1.5" step="0.02"> body <input id="kb" class="k" type="number" value="1.035" min="1" max="1.5" step="0.005"></p>
    <a id="dl" class="dl" download>Download skin</a>

    <hr>
    <h2>3D head (.stl)</h2>
    <canvas id="head3d" width="280" height="280"></canvas>
    <p class="hint">Drag to spin. Like the Skin Layers 3D mod: the hat layer is extruded into blocks, slightly bigger than the head, that wrap around the corners.</p>
    <label>Width <input id="mm" type="number" value="50" min="10" max="250" step="1"> mm</label>
    <button id="stl" type="button">Download .stl</button>
  </div>
</main>
<script>
const $ = id => document.getElementById(id);
let blobUrl, currentName = 'skin';

/* ---------- 3D models: second layer extruded like Skin Layers 3D ---------- */
let skinData = null, skinW = 64, skinH = 64, slimArms = false, headR = 5;

const DIRS = {
  '+x': [1, 0, 0], '-x': [-1, 0, 0], '+y': [0, 1, 0],
  '-y': [0, -1, 0], '+z': [0, 0, 1], '-z': [0, 0, -1],
};
// Quad corners, counter-clockwise seen from outside, for a box x0..x1, y0..y1, z0..z1
const CORNERS = {
  '+x': (x0, x1, y0, y1, z0, z1) => [[x1,y0,z0],[x1,y1,z0],[x1,y1,z1],[x1,y0,z1]],
  '-x': (x0, x1, y0, y1, z0, z1) => [[x0,y0,z0],[x0,y0,z1],[x0,y1,z1],[x0,y1,z0]],
  '+y': (x0, x1, y0, y1, z0, z1) => [[x0,y1,z0],[x0,y1,z1],[x1,y1,z1],[x1,y1,z0]],
  '-y': (x0, x1, y0, y1, z0, z1) => [[x0,y0,z0],[x1,y0,z0],[x1,y0,z1],[x0,y0,z1]],
  '+z': (x0, x1, y0, y1, z0, z1) => [[x0,y0,z1],[x1,y0,z1],[x1,y1,z1],[x0,y1,z1]],
  '-z': (x0, x1, y0, y1, z0, z1) => [[x0,y0,z0],[x0,y1,z0],[x1,y1,z0],[x1,y0,z0]],
};

/* A "part" is one box of the player (head, body, an arm, a leg):
   w,h,d = size in pixels, u/v = base texture origin, ou/ov = outer layer origin,
   c = centre in the model, mirror = reuse the right limb's texture (old 64x32 skins). */
function meshPart(p, k) {
  const texel = (hat, d, x, y, z) => {
    if (p.mirror) { x = p.w - 1 - x; d = d === '+x' ? '-x' : d === '-x' ? '+x' : d; }
    const { w, h, d: dd } = p;
    const u0 = hat ? p.ou : p.u, v0 = hat ? p.ov : p.v;
    let ox, oy, px, py;
    switch (d) {
      case '+z': ox = u0 + dd;         oy = v0 + dd; px = x;          py = h - 1 - y; break;
      case '-z': ox = u0 + dd + w + dd; oy = v0 + dd; px = w - 1 - x;  py = h - 1 - y; break;
      case '-x': ox = u0;              oy = v0 + dd; px = z;          py = h - 1 - y; break;
      case '+x': ox = u0 + dd + w;     oy = v0 + dd; px = dd - 1 - z; py = h - 1 - y; break;
      case '+y': ox = u0 + dd;         oy = v0;      px = x;          py = z; break;
      default:   ox = u0 + dd + w;     oy = v0;      px = x;          py = z; // '-y'
    }
    const i = ((oy + py) * skinW + ox + px) * 4;
    return [skinData[i], skinData[i + 1], skinData[i + 2], skinData[i + 3]];
  };

  const hx = p.w / 2, hy = p.h / 2, hz = p.d / 2;
  // Every box edge lies on one of these coordinates, so cut space along them
  const axis = (half, n) => {
    const raw = [-half - k, -half, half, half + k];
    for (let i = 0; i <= n; i++) raw.push(-half * k + i * k);
    return [...new Set(raw.map(v => Math.round(v * 1e5) / 1e5))].sort((a, b) => a - b);
  };
  const xs = axis(hx, p.w), ys = axis(hy, p.h), zs = axis(hz, p.d);
  const NX = xs.length - 1, NY = ys.length - 1, NZ = zs.length - 1;
  const mid = (a, i) => (a[i] + a[i + 1]) / 2;
  const at = (i, j, l) => (i * NY + j) * NZ + l;
  const ok = (i, n) => i >= 0 && i < n;
  const hasLayer = p.ou != null;

  const base = new Array(NX * NY * NZ).fill(false);
  const vox = new Array(NX * NY * NZ).fill(null);
  const bi = (c, half, n) => Math.max(0, Math.min(n - 1, Math.floor(c + half)));

  for (let i = 0; i < NX; i++) for (let j = 0; j < NY; j++) for (let l = 0; l < NZ; l++) {
    const cx = mid(xs, i), cy = mid(ys, j), cz = mid(zs, l), n = at(i, j, l);
    if (Math.abs(cx) < hx && Math.abs(cy) < hy && Math.abs(cz) < hz) { base[n] = true; continue; }
    if (!hasLayer) continue;
    const ix = Math.floor((cx + hx * k) / k), iy = Math.floor((cy + hy * k) / k), iz = Math.floor((cz + hz * k) / k);
    const list = [];
    const add = (d, cond) => {
      if (!cond) return;
      const t = texel(true, d, ix, iy, iz);
      if (t[3] > 0) list.push({ d, c: [t[0], t[1], t[2]] });
    };
    add('+z', cz > hz && cz < hz + k && ok(ix, p.w) && ok(iy, p.h));
    add('-z', cz < -hz && cz > -hz - k && ok(ix, p.w) && ok(iy, p.h));
    add('+x', cx > hx && cx < hx + k && ok(iy, p.h) && ok(iz, p.d));
    add('-x', cx < -hx && cx > -hx - k && ok(iy, p.h) && ok(iz, p.d));
    add('+y', cy > hy && cy < hy + k && ok(ix, p.w) && ok(iz, p.d));
    add('-y', cy < -hy && cy > -hy - k && ok(ix, p.w) && ok(iz, p.d));
    if (list.length) vox[n] = list;
  }
  const filled = (i, j, l) => i >= 0 && j >= 0 && l >= 0 && i < NX && j < NY && l < NZ && (base[at(i, j, l)] || vox[at(i, j, l)]);

  const quads = [];
  for (let i = 0; i < NX; i++) for (let j = 0; j < NY; j++) for (let l = 0; l < NZ; l++) {
    if (!filled(i, j, l)) continue;
    const n = at(i, j, l);
    for (const d in DIRS) {
      const o = DIRS[d];
      if (filled(i + o[0], j + o[1], l + o[2])) continue; // hidden face
      let c;
      if (base[n]) {
        const t = texel(false, d, bi(mid(xs, i), hx, p.w), bi(mid(ys, j), hy, p.h), bi(mid(zs, l), hz, p.d));
        c = [t[0], t[1], t[2]];
      } else {
        c = (vox[n].find(v => v.d === d) || vox[n][0]).c;
      }
      const q = CORNERS[d](xs[i], xs[i + 1], ys[j], ys[j + 1], zs[l], zs[l + 1]);
      quads.push({ v: q.map(v => [v[0] + p.c[0], v[1] + p.c[1], v[2] + p.c[2]]), n: o, c });
    }
  }
  return quads;
}

function partList(slim, modern) {
  const aw = slim ? 3 : 4;
  return [
    { head: true, w: 8, h: 8, d: 8, u: 0, v: 0, ou: 32, ov: 0, c: [0, 28, 0] },
    { w: 8, h: 12, d: 4, u: 16, v: 16, ou: modern ? 16 : null, ov: 32, c: [0, 18, 0] },
    { w: aw, h: 12, d: 4, u: 40, v: 16, ou: modern ? 40 : null, ov: 32, c: [-(4 + aw / 2), 18, 0] },
    modern
      ? { w: aw, h: 12, d: 4, u: 32, v: 48, ou: 48, ov: 48, c: [4 + aw / 2, 18, 0] }
      : { w: aw, h: 12, d: 4, u: 40, v: 16, ou: null, ov: 0, mirror: true, c: [4 + aw / 2, 18, 0] },
    { w: 4, h: 12, d: 4, u: 0, v: 16, ou: modern ? 0 : null, ov: 32, c: [-2, 6, 0] },
    modern
      ? { w: 4, h: 12, d: 4, u: 16, v: 48, ou: 0, ov: 48, c: [2, 6, 0] }
      : { w: 4, h: 12, d: 4, u: 0, v: 16, ou: null, ov: 0, mirror: true, c: [2, 6, 0] },
  ];
}

const layerSize = (id, def) => Math.max(1, Math.min(1.5, parseFloat($(id).value) || def));

function meshAll() {
  if (!skinData) return;
  const kh = layerSize('kh', 1.18), kb = layerSize('kb', 1.035);
  const P = partList(slimArms, skinH >= 64);
  bodyView.quads = P.flatMap(p => meshPart(p, p.head ? kh : kb));
  headView.quads = meshPart({ ...P[0], c: [0, 0, 0] }, kh); // the head on its own, centred
  headR = 4 + kh;
  bodyView.rev = (bodyView.rev || 0) + 1; headView.rev = (headView.rev || 0) + 1;
  headView.span = headR * 2 * 1.85;
}

function buildModels(img, slim) {
  const cv = document.createElement('canvas');
  cv.width = img.width; cv.height = img.height;
  const g = cv.getContext('2d', { willReadFrequently: true });
  g.drawImage(img, 0, 0);
  skinData = g.getImageData(0, 0, img.width, img.height).data;
  skinW = img.width; skinH = img.height; slimArms = slim;
  meshAll();
}

/* ---------- little 3D viewer (drag to spin) ---------- */
const viewers = [];
function makeViewer(id, span, centre, pitch) {
  const cv = $(id), v = { cv, quads: [], yaw: 0.6, pitch, auto: true, span, centre };
  let drag = null;
  cv.addEventListener('pointerdown', e => { drag = [e.clientX, e.clientY]; v.auto = false; cv.setPointerCapture(e.pointerId); });
  cv.addEventListener('pointermove', e => {
    if (!drag) return;
    v.yaw += (e.clientX - drag[0]) * 0.012;
    v.pitch = Math.max(-1.4, Math.min(1.4, v.pitch + (e.clientY - drag[1]) * 0.012));
    drag = [e.clientX, e.clientY];
  });
  cv.addEventListener('pointerup', () => drag = null);
  viewers.push(v);
  return v;
}
const bodyView = makeViewer('body3d', 40, [0, 16, 0], 0.15);
const headView = makeViewer('head3d', 18.5, [0, 0, 0], 0.3);

function render(v) {
  const g = v.cv.getContext('2d'), W = v.cv.width, H = v.cv.height;
  g.clearRect(0, 0, W, H);
  const cy = Math.cos(v.yaw), sy = Math.sin(v.yaw), cp = Math.cos(v.pitch), sp = Math.sin(v.pitch);
  const rot = (x, y, z) => {
    const x1 = x * cy + z * sy, z1 = -x * sy + z * cy;
    return [x1, y * cp - z1 * sp, y * sp + z1 * cp];
  };
  const S = Math.min(W, H) / v.span, L = [-0.35, 0.6, 0.72], c = v.centre;
  const out = [];
  for (const q of v.quads) {
    const n = rot(q.n[0], q.n[1], q.n[2]);
    if (n[2] <= 0) continue; // faces pointing away
    const p = q.v.map(t => rot(t[0] - c[0], t[1] - c[1], t[2] - c[2]));
    const depth = (p[0][2] + p[1][2] + p[2][2] + p[3][2]) / 4;
    const lit = 0.5 + 0.5 * Math.max(0, n[0] * L[0] + n[1] * L[1] + n[2] * L[2]);
    out.push({ p, depth, col: `rgb(${q.c[0] * lit | 0},${q.c[1] * lit | 0},${q.c[2] * lit | 0})` });
  }
  out.sort((a, b) => a.depth - b.depth);
  g.lineWidth = 0.7; g.lineJoin = 'round';
  for (const o of out) {
    g.beginPath();
    o.p.forEach((pt, i) => { const X = W / 2 + pt[0] * S, Y = H / 2 - pt[1] * S; i ? g.lineTo(X, Y) : g.moveTo(X, Y); });
    g.closePath();
    g.fillStyle = g.strokeStyle = o.col;
    g.fill(); g.stroke();
  }
}

(function loop() {
  for (const v of viewers) {
    if (v.auto) v.yaw += 0.012;
    const sig = v.yaw + '|' + v.pitch + '|' + v.quads.length + '|' + (v.rev || 0);
    if (v.quads.length && sig !== v.sig) { v.sig = sig; render(v); } // only redraw when something changed
  }
  requestAnimationFrame(loop);
})();

$('kh').addEventListener('input', meshAll);
$('kb').addEventListener('input', meshAll);

$('stl').addEventListener('click', () => {
  const quads = headView.quads;
  if (!quads.length) return;
  const mm = Math.max(5, Math.min(500, parseFloat($('mm').value) || 50));
  const s = mm / (2 * headR);
  let minY = Infinity;
  for (const q of quads) for (const v of q.v) minY = Math.min(minY, v[1]);
  const tris = [];
  for (const q of quads) {
    // Z-up for printing; the face points toward -Y; sits flat on Z=0
    const p = q.v.map(v => [v[0] * s, -v[2] * s, (v[1] - minY) * s]);
    tris.push([p[0], p[1], p[2]], [p[0], p[2], p[3]]);
  }
  const buf = new ArrayBuffer(84 + tris.length * 50), dv = new DataView(buf);
  dv.setUint32(80, tris.length, true);
  let o = 84;
  for (const t of tris) {
    const u = [t[1][0] - t[0][0], t[1][1] - t[0][1], t[1][2] - t[0][2]];
    const v = [t[2][0] - t[0][0], t[2][1] - t[0][1], t[2][2] - t[0][2]];
    const n = [u[1] * v[2] - u[2] * v[1], u[2] * v[0] - u[0] * v[2], u[0] * v[1] - u[1] * v[0]];
    const len = Math.hypot(n[0], n[1], n[2]) || 1;
    for (const val of [n[0] / len, n[1] / len, n[2] / len, ...t[0], ...t[1], ...t[2]]) { dv.setFloat32(o, val, true); o += 4; }
    o += 2; // attribute bytes
  }
  const url = URL.createObjectURL(new Blob([buf], { type: 'model/stl' }));
  const a = document.createElement('a');
  a.href = url; a.download = currentName + '_head.stl';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
});

function draw(img) {
  const s = $('sheet').getContext('2d');
  s.clearRect(0, 0, 64, 64);
  s.drawImage(img, 0, 0);
}

$('f').addEventListener('submit', async e => {
  e.preventDefault();
  const name = $('name').value.trim();
  if (!/^\w{1,16}$/.test(name)) { $('msg').textContent = 'Usernames are letters, numbers and underscores only.'; return; }
  $('msg').textContent = 'Looking up…';
  $('out').style.display = 'none';
  try {
    const r = await fetch('/api/skin/' + encodeURIComponent(name));
    if (r.status === 404) { $('msg').textContent = 'No player with that name (or no skin).'; return; }
    if (!r.ok) throw new Error();
    const slim = r.headers.get('X-Skin-Model') === 'slim';
    const real = r.headers.get('X-Skin-Name') || name;
    const blob = await r.blob();
    if (blobUrl) URL.revokeObjectURL(blobUrl);
    blobUrl = URL.createObjectURL(blob);
    const img = new Image();
    img.onload = () => {
      draw(img);
      currentName = real;
      buildModels(img, slim);
      $('dl').href = blobUrl;
      $('dl').download = real + '.png';
      $('out').style.display = 'block';
      $('msg').textContent = real + (slim ? ' (slim arms)' : '');
    };
    img.src = blobUrl;
  } catch {
    $('msg').textContent = 'Something went wrong. Try again in a minute.';
  }
});

</script>
</body>
</html>
